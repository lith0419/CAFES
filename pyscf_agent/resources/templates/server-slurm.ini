# Server configuration generated by
# `pyscf-agent-configure init-config server-slurm`.
# Keep every Slurm server in this one file as a named [server:<profile>]
# section. Resource profiles are namespaced by the same server profile.

[server:amarel]
cluster_id = amarel
work_root = /scratch/your_username/pyscf-agent
project_root = /path/to/pyscf-agent
python_executable = /path/to/conda/env/bin/python
shared_filesystem = true
setup_commands =
    source /path/to/conda/etc/profile.d/conda.sh
    conda activate your_environment
    cd "$SLURM_SUBMIT_DIR"
    ulimit -s unlimited
    export OMP_NUM_THREADS="$SLURM_CPUS_PER_TASK"
    export OPENBLAS_NUM_THREADS="$SLURM_CPUS_PER_TASK"
    export MKL_NUM_THREADS="$SLURM_CPUS_PER_TASK"
    export OMP_DYNAMIC=FALSE
    export MKL_DYNAMIC=FALSE
# Block2 maps SLURM_CPUS_PER_TASK to its node-level n_threads unless overridden.
account =
# Set a partition you can access, or leave blank to use the cluster default.
partition =
qos =
time = 24:00:00
nodes = 1
ntasks = 1
cpus_per_task = 8
memory = 16G
gres =
constraint =
# Optional sbatch arguments. Add --nodelist only if your cluster requires it,
# using nodes you are authorized to access; otherwise leave blank.
# All resource profiles below inherit these arguments.
extra_sbatch_args =
task_command_prefix = time srun
job_name_prefix = pyscf-agent
max_array_size = 1000
max_parallel = 8
poll_interval_seconds = 15
wait_timeout_seconds = 0

# Optional server-owned profiles shown by name in the Web UI.
[profile:amarel:standard]
label = Standard

[profile:amarel:cpu_intensive]
label = CPU Intensive
cpus_per_task = 16
memory = 32G

[profile:amarel:memory_intensive]
label = Memory Intensive
cpus_per_task = 16
memory = 64G

[profile:amarel:long_running]
label = Long Running
cpus_per_task = 16
memory = 32G
time = 60:00:00

# Add another cluster to this same file. Its resource profiles use the matching
# namespace, for example [profile:secondary:standard].
