# Local configuration generated by `pyscf-agent-configure init-config remote`.
# Store private-key paths here, never private-key contents or passwords.

[remote:amarel]
host = server.example.edu
port = 22
username = your_username
private_key = ~/.ssh/id_ed25519
known_hosts = ~/.ssh/known_hosts
strict_host_key_checking = true
connect_timeout_seconds = 15

# These are paths on the remote server.
remote_python = /path/to/conda/env/bin/python
# Every remote profile may point to the same server-slurm.ini. This option
# chooses the matching [server:amarel] section inside that file.
remote_slurm_config = /path/to/.pyscf-agent/server-slurm.ini
remote_slurm_profile = amarel
expected_cluster_id = amarel

# A per-worktree deployment writes this file and enables exact local/remote
# release matching. Leave disabled only for legacy installations.
runtime_identity_file = runtime-identity.json
require_runtime_match = true
local_source_root = ../..
# deploy-remote writes these separately so redeploying never chains one
# immutable release wrapper through an older release wrapper.
deployment_base_python = /path/to/conda/env/bin/python
deployment_base_slurm_profile = amarel

poll_interval_seconds = 15
wait_timeout_seconds = 0
report_propagation_timeout_seconds = 120
control_persist_seconds = 600

# Add another server backed by another section in the same INI structure:
# [remote:other-cluster]
# host = other.example.edu
